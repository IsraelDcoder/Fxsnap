<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>FXSnap Staff Console</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080d17;
      color: #eef3fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --panel: #111a29;
      --panel-raised: #172235;
      --border: #26354b;
      --muted: #9aa9bd;
      --accent: #6de0bd;
      --danger: #ff8e9b;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 12% 0%, #142a39 0%, #080d17 46%); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1280px; margin: 0 auto; padding: 28px 24px 60px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 13px; color: #07120f; background: var(--accent); font-weight: 900; }
    h1 { margin: 0; font-size: 19px; letter-spacing: -.02em; }
    .eyebrow { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; }
    .status { min-height: 22px; color: var(--muted); font-size: 13px; }
    .status.error { color: var(--danger); }
    .status.success { color: var(--accent); }
    .card { border: 1px solid var(--border); background: rgba(17, 26, 41, .94); border-radius: 18px; box-shadow: 0 18px 55px #0003; }
    .login { width: min(460px, 100%); margin: 10vh auto; padding: 28px; }
    .login h2 { margin: 0 0 8px; font-size: 25px; }
    .login p { color: var(--muted); line-height: 1.55; margin: 8px 0 20px; }
    .login form { display: grid; gap: 12px; }
    .workspace { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; }
    nav { padding: 12px; height: max-content; position: sticky; top: 20px; }
    nav button { width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 12px; color: var(--muted); background: transparent; margin: 2px 0; }
    nav button:hover, nav button[aria-current="page"] { color: #f2f7ff; background: var(--panel-raised); }
    nav button[aria-current="page"] { box-shadow: inset 3px 0 var(--accent); }
    .panel { padding: 22px; min-height: 450px; }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    h2 { font-size: 22px; margin: 0 0 6px; }
    h3 { font-size: 16px; margin: 0 0 12px; }
    .muted, small { color: var(--muted); }
    .stack { display: grid; gap: 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .item { border: 1px solid var(--border); border-radius: 13px; padding: 15px; background: #0e1725; }
    .item-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .item p { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; margin: 9px 0; }
    .meta { display: flex; flex-wrap: wrap; gap: 7px 12px; font-size: 12px; color: var(--muted); margin-top: 9px; }
    .badge { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 999px; padding: 4px 8px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 13px; }
    .btn { border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; color: #eaf1fa; background: var(--panel-raised); }
    .btn:hover { border-color: #54708d; }
    .btn.primary { color: #07120f; border-color: var(--accent); background: var(--accent); font-weight: 700; }
    .btn.danger { color: var(--danger); }
    .btn:disabled { cursor: not-allowed; opacity: .5; }
    .icon-button { border: 0; color: var(--muted); background: transparent; padding: 9px; }
    form.editor { display: grid; gap: 12px; padding: 16px; border: 1px solid var(--border); border-radius: 13px; background: #0e1725; margin-bottom: 18px; }
    label { display: grid; gap: 6px; color: #cbd6e5; font-size: 13px; }
    input, select, textarea { width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px; color: #eef3fb; background: #09111d; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 95px; resize: vertical; }
    .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); }
    .check input { width: auto; accent-color: var(--accent); }
    .two-column { display: grid; grid-template-columns: minmax(220px, .75fr) minmax(0, 1.5fr); gap: 16px; }
    .conversation-list { display: grid; align-content: start; gap: 8px; }
    .conversation-button { text-align: left; width: 100%; border: 1px solid var(--border); border-radius: 11px; padding: 12px; color: #eaf1fa; background: #0e1725; }
    .conversation-button.selected { border-color: var(--accent); }
    .messages { display: grid; gap: 8px; max-height: 420px; overflow: auto; margin: 12px 0; }
    .message { max-width: 88%; padding: 10px 12px; border-radius: 12px; background: var(--panel-raised); white-space: pre-wrap; overflow-wrap: anywhere; }
    .message.member { justify-self: start; }
    .message.admin { justify-self: end; border: 1px solid #285346; }
    .message time { display: block; color: var(--muted); font-size: 11px; margin-top: 6px; }
    a { color: var(--accent); }
    .empty { border: 1px dashed var(--border); border-radius: 12px; padding: 24px; color: var(--muted); text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 760px) {
      .shell { padding: 18px 13px 40px; }
      .workspace { grid-template-columns: 1fr; }
      nav { position: static; display: flex; overflow: auto; gap: 4px; padding: 8px; }
      nav button { width: auto; white-space: nowrap; }
      nav button[aria-current="page"] { box-shadow: inset 0 -3px var(--accent); }
      .panel { padding: 16px; }
      .grid, .two-column { grid-template-columns: 1fr; }
      .panel-head { align-items: center; }
    }
  </style>
  <script src="/admin-console.js" defer></script>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">
        <div class="mark" aria-hidden="true">F</div>
        <div>
          <div class="eyebrow">FXSnap · Staff only</div>
          <h1>Operations console</h1>
        </div>
      </div>
      <button id="sign-out" class="btn" type="button" hidden>Sign out</button>
    </header>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="login" class="card login" hidden>
      <div class="eyebrow">Secure staff access</div>
      <h2>Sign in with a magic link</h2>
      <p>Use an approved staff email. The link opens this console; access is checked against the server-side staff allowlist.</p>
      <form id="login-form">
        <label>Email address
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        </label>
        <button class="btn primary" type="submit">Send sign-in link</button>
      </form>
    </section>
    <section id="workspace" class="workspace" hidden>
      <nav class="card" aria-label="Staff modules">
        <button type="button" data-tab="community" aria-current="page">Community moderation</button>
        <button type="button" data-tab="support">Support inbox</button>
        <button type="button" data-tab="events">Events</button>
        <button type="button" data-tab="announcements">Announcements</button>
      </nav>
      <section id="panel" class="card panel" aria-live="polite"></section>
    </section>
  </main>
</body>
</html>
